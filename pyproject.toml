[project]
name = "vessel"
version = "0.1.0"
description = "Data pipeline for an F1 content profile: stats, charts and tweet-ready drafts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastf1>=3.6",
    "httpx>=0.28",
    "icalendar>=6.1",
    "matplotlib>=3.10",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
]

[project.scripts]
vessel = "vessel.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pandas-stubs>=2.2",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vessel"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PL", "PT"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastf1.*", "icalendar.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: hits external sources; skipped in CI"]
